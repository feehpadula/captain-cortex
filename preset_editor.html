<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>captain-cortex — Preset Editor</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap');

  :root {
    --bg:        #0a0a0a;
    --surface:   #111111;
    --border:    #1e1e1e;
    --accent:    #BE0A5A;
    --cyan:      #00BEBE;
    --text:      #e8e8e8;
    --muted:     #888;
    --dim:       #333;
    --on:        #BE0A5A;
    --off:       #1a1a1a;
    --on-text:   #fff;
    --off-text:  #444;
    --row-hover: #161616;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    min-height: 100vh;
    padding: 40px 24px;
  }

  header {
    display: flex;
    align-items: baseline;
    gap: 16px;
    margin-bottom: 40px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 20px;
  }

  header h1 {
    font-family: 'Space Mono', monospace;
    font-size: 18px;
    color: var(--cyan);
    letter-spacing: -0.5px;
  }

  header span {
    font-size: 12px;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
  }

  .toolbar {
    display: flex;
    gap: 10px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }

  button {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    padding: 8px 16px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    letter-spacing: 0.5px;
    transition: all 0.15s;
  }

  button:hover { border-color: var(--muted); background: #1a1a1a; }

  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  button.primary:hover { background: #d40d66; border-color: #d40d66; }

  button.cyan {
    background: transparent;
    border-color: var(--cyan);
    color: var(--cyan);
  }
  button.cyan:hover { background: rgba(0,190,190,0.08); }

  .pages-tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 20px;
  }

  .page-tab {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    padding: 6px 18px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
  }

  .page-tab.active {
    border-color: var(--cyan);
    color: var(--cyan);
    background: rgba(0,190,190,0.06);
  }

  .page-tab:hover:not(.active) { border-color: var(--dim); color: var(--text); }

  /* ── Main layout ── */
  .main-layout {
    display: flex;
    gap: 32px;
    align-items: flex-start;
  }

  .table-col { flex: 1; min-width: 0; }

  .preview-col {
    flex-shrink: 0;
    width: 300px;
    position: sticky;
    top: 24px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  thead th {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 10px 12px;
    text-align: left;
    border-bottom: 1px solid var(--border);
  }

  thead th.fx-col { text-align: center; }

  tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background 0.1s;
  }

  tbody tr:hover { background: var(--row-hover); }

  td { padding: 10px 12px; vertical-align: middle; }

  td.pc {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    width: 48px;
  }

  td.name-cell { min-width: 140px; }

  .name-input {
    background: transparent;
    border: 1px solid transparent;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    padding: 4px 8px;
    width: 100%;
    outline: none;
    transition: border-color 0.15s;
  }

  .name-input:hover  { border-color: var(--dim); }
  .name-input:focus  { border-color: var(--cyan); }

  td.fx-col { text-align: center; width: 58px; }

  .fx-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 24px;
    border: 1px solid var(--off);
    background: var(--off);
    color: var(--off-text);
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: all 0.15s;
    user-select: none;
  }

  .fx-btn.on {
    background: var(--on);
    border-color: var(--on);
    color: var(--on-text);
  }

  .fx-btn:hover { filter: brightness(1.3); }

  td.actions-cell {
    text-align: right;
    width: 50px;
  }

  .del-btn {
    background: transparent;
    border: 1px solid transparent;
    color: var(--muted);
    font-size: 16px;
    padding: 2px 8px;
    cursor: pointer;
    transition: all 0.15s;
    line-height: 1;
  }

  .del-btn:hover { color: var(--accent); border-color: var(--accent); }

  /* ── Device preview ── */
  .preview-label {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .device {
    background: #181818;
    border: 2px solid #2a2a2a;
    border-radius: 8px;
    padding: 16px;
  }

  /* Display */
  .mc-display {
    background: #000;
    border: 1px solid #333;
    border-radius: 4px;
    width: 100%;
    aspect-ratio: 1;
    margin-bottom: 16px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  /* Header rows (FX indicators) */
  .mc-headers {
    display: flex;
    flex-direction: column;
    height: 25%;
  }

  .mc-header-row {
    display: flex;
    width: 100%;
    flex: 1;
  }

  .mc-fx-indicator {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    border: 1px solid #000;
    color: #e8e8e8;
    transition: all 0.2s;
  }

  /* Preset name area */
  .mc-preset-name {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Space Mono', monospace;
    font-size: 24px;
    font-weight: 700;
    color: #e8e8e8;
    text-align: center;
    padding: 8px;
    word-break: break-word;
    line-height: 1.3;
  }

  /* Pager label */
  .mc-pager {
    height: 25%;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Space Mono', monospace;
    font-size: 24px;
    font-weight: 700;
    color: #000;
    border-radius: 0 0 3px 3px;
  }

  /* Switches */
  .mc-switches {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .mc-row {
    display: flex;
    gap: 6px;
  }

  .mc-switch {
    flex: 1;
    background: #222;
    border: 1px solid #333;
    border-radius: 4px;
    padding: 6px 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    cursor: pointer;
    transition: all 0.15s;
    min-height: 52px;
  }

  .mc-switch:hover { border-color: #555; }

  .mc-switch.active { border-color: rgba(0,190,190,0.5); }

  .mc-leds {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
  }

  .mc-led {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #222;
    transition: all 0.2s;
  }

  .mc-switch-label {
    font-family: 'Space Mono', monospace;
    font-size: 8px;
    color: #777;
    text-align: center;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    width: 100%;
    padding: 0 2px;
  }

  .mc-switch.active .mc-switch-label { color: var(--cyan); }

  .mc-nav {
    flex: 0 0 36px;
    background: #222;
    border: 1px solid #333;
    border-radius: 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    min-height: 52px;
  }

  .mc-nav-led {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #444;
  }

  .mc-nav-label {
    font-family: 'Space Mono', monospace;
    font-size: 8px;
    color: #777;
  }

  /* Output */
  .output-area {
    margin-top: 40px;
    border-top: 1px solid var(--border);
    padding-top: 24px;
  }

  .output-label {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  textarea {
    width: 100%;
    height: 320px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: #aaa;
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    padding: 16px;
    outline: none;
    resize: vertical;
    line-height: 1.7;
  }

  textarea:focus { border-color: var(--dim); }

  .stats {
    display: flex;
    gap: 24px;
    margin-bottom: 20px;
  }

  .stat { font-family: 'Space Mono', monospace; font-size: 11px; }
  .stat-val { color: var(--cyan); }
  .stat-label { color: var(--muted); margin-left: 4px; }

  .btn-import {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    padding: 8px 16px;
    border: 1px solid var(--cyan);
    background: transparent;
    color: var(--cyan);
    cursor: pointer;
    letter-spacing: 0.5px;
    transition: all 0.15s;
    display: inline-block;
  }
  .btn-import:hover { background: rgba(0,190,190,0.08); }

  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--cyan);
    color: #000;
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    padding: 10px 20px;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <h1>captain-cortex</h1>
  <span>preset editor → presets.py</span>
</header>

<div class="toolbar">
  <button class="cyan" onclick="loadDefault()">↺ Reset</button>
  <label class="btn-import">
    ⬆ Import presets.py
    <input type="file" accept=".py" onchange="importFile(event)" style="display:none">
  </label>
  <button onclick="copyOutput()">⎘ Generate &amp; Copy</button>
  <button class="primary" onclick="downloadOutput()">⬇ Download presets.py</button>
</div>

<div class="stats" id="stats"></div>
<div class="pages-tabs" id="pageTabs"></div>

<div class="main-layout">

  <!-- Table -->
  <div class="table-col">
    <table>
      <thead>
        <tr>
          <th>PC</th>
          <th>Preset Name</th>
          <th class="fx-col">GATE</th>
          <th class="fx-col">FX 1</th>
          <th class="fx-col">FX 2</th>
          <th class="fx-col">FX 3</th>
          <th class="fx-col">FX 4</th>
          <th class="fx-col">FX 5</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="presetTable"></tbody>
    </table>
  </div>

  <!-- Device preview -->
  <div class="preview-col">
    <div class="preview-label">Device Preview</div>
    <div class="device">

      <!-- Display -->
      <div class="mc-display">
      <div class="mc-headers" id="prev-headers"></div>
        <div class="mc-preset-name" id="prev-name">—</div>
        <div class="mc-pager" id="prev-pager">A</div>
      </div>

      <!-- Switch rows -->
      <div class="mc-switches">
        <!-- Row 1: 1 2 3 4 UP -->
        <div class="mc-row">
          <div class="mc-switch" id="psw-0"><div class="mc-leds" id="pl-0"></div><div class="mc-switch-label" id="psl-0">1</div></div>
          <div class="mc-switch" id="psw-1"><div class="mc-leds" id="pl-1"></div><div class="mc-switch-label" id="psl-1">2</div></div>
          <div class="mc-switch" id="psw-2"><div class="mc-leds" id="pl-2"></div><div class="mc-switch-label" id="psl-2">3</div></div>
          <div class="mc-switch" id="psw-3"><div class="mc-leds" id="pl-3"></div><div class="mc-switch-label" id="psl-3">4</div></div>
          <div class="mc-nav" id="nav-up">
            <div style="display:flex;gap:3px"><div class="mc-nav-led"></div><div class="mc-nav-led"></div></div>
            <div class="mc-nav-led"></div>
            <div class="mc-nav-label">UP</div>
          </div>
        </div>
        <!-- Row 2: A B C D DOWN -->
        <div class="mc-row">
          <div class="mc-switch" id="psw-4"><div class="mc-leds" id="pl-4"></div><div class="mc-switch-label" id="psl-4">A</div></div>
          <div class="mc-switch" id="psw-5"><div class="mc-leds" id="pl-5"></div><div class="mc-switch-label" id="psl-5">B</div></div>
          <div class="mc-switch" id="psw-6"><div class="mc-leds" id="pl-6"></div><div class="mc-switch-label" id="psl-6">C</div></div>
          <div class="mc-switch" id="psw-7"><div class="mc-leds" id="pl-7"></div><div class="mc-switch-label" id="psl-7">D</div></div>
          <div class="mc-nav" id="nav-down">
            <div class="mc-nav-led"></div>
            <div style="display:flex;gap:3px"><div class="mc-nav-led"></div><div class="mc-nav-led"></div></div>
            <div class="mc-nav-label">DN</div>
          </div>
        </div>
      </div>

    </div>
  </div>

</div>

<div class="output-area">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px">
    <div class="output-label" style="margin-bottom:0">presets.py output</div>
    <div style="display:flex; gap:8px">
      <button onclick="copyOutput()">⎘ Generate &amp; Copy</button>
      <button class="primary" onclick="downloadOutput()">⬇ Download presets.py</button>
    </div>
  </div>
  <textarea id="output" readonly placeholder="Click 'Generate & Copy' or 'Download' to see the output..."></textarea>
</div>

<div class="toast" id="toast"></div>

<script>
const PAGE_NAMES = ["A","B","C","D","E","F","G","H"];
const FX_KEYS   = ["gate","fx1","fx2","fx3","fx4","fx5"];
const FX_LABELS = ["GATE","FX 1","FX 2","FX 3","FX 4","FX 5"];
const SW_LABELS = ["1","2","3","4","A","B","C","D"];

const COLOR_CYAN   = "#00BEBE";
const COLOR_WHITE  = "#ffffff";
const COLOR_PINK   = "#BE0A5A";
const COLOR_OFF    = "#1a1a1a";
const COLOR_EMPTY  = "#111";

let presets = Array.from({length: 64}, (_, i) => ({
  pc: i, name: '',
  gate: false, fx1: false, fx2: false, fx3: false, fx4: false, fx5: false
}));

let currentPage    = 0;
let selectedSlot   = -1;  // sw_idx of selected preset on current page (-1 = none)

function nPages() { return Math.ceil(presets.length / 8); }
function presetsOnPage(page) { return presets.filter(p => Math.floor(p.pc / 8) === page); }

// ── Preview ───────────────────────────────────────────────────────────────────

function renderPreview() {
  const pagePresets = presetsOnPage(currentPage);

  // FX headers — 2 linhas de 3
  const headers = document.getElementById("prev-headers");
  headers.innerHTML = "";
  const fxState = selectedSlot >= 0 ? pagePresets[selectedSlot] : null;
  [FX_KEYS.slice(0,3), FX_KEYS.slice(3)].forEach((rowKeys, ri) => {
    const row = document.createElement("div");
    row.className = "mc-header-row";
    rowKeys.forEach((key, ki) => {
      const globalIdx = ri * 3 + ki;
      const div = document.createElement("div");
      div.className = "mc-fx-indicator" + (fxState && fxState[key] ? " active" : "");
      div.style.color = "#e8e8e8";
      div.style.background = fxState && fxState[key] ? COLOR_PINK : "transparent";
      div.style.borderColor = "#000";
      div.textContent = FX_LABELS[globalIdx];
      row.appendChild(div);
    });
    headers.appendChild(row);
  });

  // Preset name
  const nameEl = document.getElementById("prev-name");
  if (selectedSlot >= 0 && fxState && fxState.name.trim() !== '') {
    nameEl.textContent = fxState.name;
    nameEl.style.color = "#e8e8e8";
  } else {
    nameEl.textContent = "—";
    nameEl.style.color = "#333";
  }

  // Pager label
  const pageName = PAGE_NAMES[currentPage];
  const pagerEl  = document.getElementById("prev-pager");
  if (selectedSlot >= 0 && fxState && fxState.name.trim() !== '') {
    pagerEl.textContent = `${pageName}${SW_LABELS[selectedSlot]} - ${fxState.pc + 1}`;
  } else {
    pagerEl.textContent = pageName;
  }

  // Switches
  for (let i = 0; i < 8; i++) {
    const preset   = pagePresets[i];
    const swEl     = document.getElementById(`psw-${i}`);
    const ledsEl   = document.getElementById(`pl-${i}`);
    const labelEl  = document.getElementById(`psl-${i}`);
    const isEmpty  = !preset || preset.name.trim() === '';
    const isActive = (i === selectedSlot) && !isEmpty;

    ledsEl.innerHTML = "";

    // Switches 0-3 (1,2,3,4): 2 leds em cima + 1 em baixo
    // Switches 4-7 (A,B,C,D): 1 led em cima + 1 em baixo
    // Layout SVG simula a disposição circular real

    if (i < 4) {
      // Row top: 2 leds (preset)
      const top = document.createElement("div");
      top.style.cssText = "display:flex;gap:3px;";
      for (let l = 0; l < 2; l++) {
        const led = document.createElement("div");
        led.className = "mc-led";
        if (isEmpty) led.style.background = COLOR_EMPTY;
        else if (isActive) { led.style.background = COLOR_CYAN; led.style.boxShadow = `0 0 4px ${COLOR_CYAN}`; }
        else { led.style.background = COLOR_WHITE; led.style.opacity = "0.4"; }
        top.appendChild(led);
      }
      ledsEl.appendChild(top);

      // Bottom: 1 led (GATE no switch 1, preset nos outros)
      const bot = document.createElement("div");
      const led = document.createElement("div");
      led.className = "mc-led";
      if (i === 0) {
        // Switch 1: led inferior = GATE — acende se fxState tem gate, independente de ser o slot ativo
        const gateOn = fxState && fxState.gate;
        led.style.background = gateOn ? COLOR_PINK : (isEmpty ? COLOR_EMPTY : COLOR_WHITE);
        if (gateOn) led.style.boxShadow = `0 0 4px ${COLOR_PINK}`;
        if (!gateOn && !isEmpty) led.style.opacity = "0.1";
      } else {
        if (isEmpty) led.style.background = COLOR_EMPTY;
        else if (isActive) { led.style.background = COLOR_CYAN; led.style.boxShadow = `0 0 4px ${COLOR_CYAN}`; }
        else { led.style.background = COLOR_WHITE; led.style.opacity = "0.4"; }
      }
      bot.appendChild(led);
      ledsEl.appendChild(bot);

    } else {
      // A, B, C, D: 1 led em cima (FX) + 2 em baixo (preset)
      const fxKeys = ["fx1","fx2","fx3","fx4"];
      const fxKey  = fxKeys[i - 4];
      // FX acende se fxState (preset em edição) tem aquele FX ativo
      const fxOn   = fxState && fxState[fxKey];

      // Top: FX
      const top = document.createElement("div");
      const topLed = document.createElement("div");
      topLed.className = "mc-led";
      topLed.style.background = fxOn ? COLOR_PINK : (isEmpty ? COLOR_EMPTY : COLOR_WHITE);
      if (!fxOn && !isEmpty) topLed.style.opacity = "0.1";
      else topLed.style.opacity = "1";
      top.appendChild(topLed);
      ledsEl.appendChild(top);

      // Bottom: 2 leds (preset)
      const bot = document.createElement("div");
      bot.style.cssText = "display:flex;gap:3px;";
      for (let l = 0; l < 2; l++) {
        const botLed = document.createElement("div");
        botLed.className = "mc-led";
        if (isEmpty) botLed.style.background = COLOR_EMPTY;
        else if (isActive) { botLed.style.background = COLOR_CYAN; botLed.style.boxShadow = `0 0 4px ${COLOR_CYAN}`; }
        else { botLed.style.background = COLOR_WHITE; botLed.style.opacity = "0.4"; }
        bot.appendChild(botLed);
      }
      ledsEl.appendChild(bot);
    }

    // Label
    labelEl.textContent = SW_LABELS[i];
    if (!isEmpty) {
      labelEl.textContent = `${SW_LABELS[i]} · ${preset.pc + 1}`;
    }
    swEl.className = "mc-switch" + (isActive ? " active" : "");
    swEl.style.opacity = isEmpty ? "0.25" : "1";
  }

  // UP e DOWN leds dim sempre acesos
  document.querySelectorAll('#nav-up .mc-nav-led').forEach(l => { l.style.background = COLOR_WHITE; l.style.opacity = '0.4'; });
  const downLeds = document.querySelectorAll('#nav-down .mc-nav-led');
  const fx5On = fxState && fxState.fx5;
  if (downLeds.length >= 1) {
    downLeds[0].style.background = fx5On ? COLOR_PINK : COLOR_WHITE;
    downLeds[0].style.opacity     = fx5On ? '1' : '0.1';
    downLeds[0].style.boxShadow   = fx5On ? `0 0 4px ${COLOR_PINK}` : 'none';
  }
  if (downLeds.length >= 2) { downLeds[1].style.background = COLOR_WHITE; downLeds[1].style.opacity = '0.4'; }
  if (downLeds.length >= 3) { downLeds[2].style.background = COLOR_WHITE; downLeds[2].style.opacity = '0.4'; }
}

// ── Render ────────────────────────────────────────────────────────────────────

function renderTabs() {
  const tabs = document.getElementById("pageTabs");
  const n = nPages();
  tabs.innerHTML = "";
  for (let i = 0; i < n; i++) {
    const btn = document.createElement("button");
    btn.className = "page-tab" + (i === currentPage ? " active" : "");
    btn.textContent = `Page ${PAGE_NAMES[i]} (${presetsOnPage(i).filter(p => p.name.trim() !== '').length})`;
    btn.onclick = () => { currentPage = i; selectedSlot = -1; render(); };
    tabs.appendChild(btn);
  }
}

function renderStats() {
  const n = nPages();
  const empty = presets.filter(p => p.name.trim() === '').length;
  document.getElementById("stats").innerHTML = `
    <div class="stat"><span class="stat-val">${presets.length - empty}</span><span class="stat-label">presets</span></div>
    <div class="stat"><span class="stat-val">${n}</span><span class="stat-label">pages (${PAGE_NAMES.slice(0,n).join(", ")})</span></div>
    <div class="stat"><span class="stat-val">${empty}</span><span class="stat-label">empty slots</span></div>
  `;
}

function renderTable() {
  const tbody = document.getElementById("presetTable");
  tbody.innerHTML = "";
  const pagePresets = presetsOnPage(currentPage);

  pagePresets.forEach((preset, swIdx) => {
    const tr = document.createElement("tr");
    tr.dataset.pc = preset.pc;
    if (swIdx === selectedSlot) tr.style.background = "rgba(0,190,190,0.05)";

    // PC
    const tdPc = document.createElement("td");
    tdPc.className = "pc";
    tdPc.textContent = preset.pc;
    tr.appendChild(tdPc);

    // Name
    const tdName = document.createElement("td");
    tdName.className = "name-cell";
    const inp = document.createElement("input");
    inp.className = "name-input";
    inp.type = "text";
    inp.value = preset.name;
    inp.placeholder = `Slot ${swIdx + 1}`;
    inp.onfocus = () => { selectedSlot = swIdx; renderPreview(); renderTable(); };
    inp.oninput = e => {
      preset.name = e.target.value;
      selectedSlot = swIdx;
      renderStats(); renderTabs(); renderPreview(); saveSession();
    };
    tdName.appendChild(inp);
    tr.appendChild(tdName);

    // FX toggles
    FX_KEYS.forEach((key) => {
      const td = document.createElement("td");
      td.className = "fx-col";
      const btn = document.createElement("div");
      btn.className = "fx-btn" + (preset[key] ? " on" : "");
      btn.textContent = preset[key] ? "ON" : "OFF";
      btn.onclick = () => {
        preset[key] = !preset[key];
        btn.className = "fx-btn" + (preset[key] ? " on" : "");
        btn.textContent = preset[key] ? "ON" : "OFF";
        selectedSlot = swIdx;
        renderPreview(); saveSession();
      };
      td.appendChild(btn);
      tr.appendChild(td);
    });

    // Clear
    const tdDel = document.createElement("td");
    tdDel.className = "actions-cell";
    const delBtn = document.createElement("button");
    delBtn.className = "del-btn";
    delBtn.textContent = "×";
    delBtn.onclick = () => {
      preset.name = '';
      preset.gate = preset.fx1 = preset.fx2 = preset.fx3 = preset.fx4 = preset.fx5 = false;
      if (selectedSlot === swIdx) selectedSlot = -1;
      saveSession(); render();
    };
    tdDel.appendChild(delBtn);
    tr.appendChild(tdDel);
    tbody.appendChild(tr);
  });
}

function render() {
  renderTabs();
  renderStats();
  renderTable();
  renderPreview();
}

// ── Generate ──────────────────────────────────────────────────────────────────

function bool(v) { return v ? "_ON " : "_OFF"; }

function generateOutput() {
  const n = nPages();
  const pageNames = PAGE_NAMES.slice(0, n);
  let out = "";
  out += `##############################################################################################################################################\n`;
  out += `#\n# presets.py — Definição dos presets da Nano Cortex\n#\n`;
  out += `# Cada preset ocupa duas linhas:\n#   Linha 1: número do PC e nome do preset\n#   Linha 2: estado dos efeitos (gate, fx1, fx2, fx3, fx4, fx5)\n#\n`;
  out += `# CCs da Nano Cortex:\n#   CC#34 = INPUT GATE | CC#37 = FX 1 | CC#38 = FX 2 | CC#39 = FX 3\n#   CC#40 = FX 4       | CC#41 = FX 5\n#\n`;
  out += `# Valores: _ON = ligado, _OFF = desligado\n#\n`;
  out += `##############################################################################################################################################\n\n`;
  out += `_ON  = True\n_OFF = False\n\n_PRESETS_RAW = [\n`;

  for (let page = 0; page < n; page++) {
    const ps = presetsOnPage(page).filter(p => p.name.trim() !== '');
    if (ps.length === 0) continue;
    out += `\n    # ── Page ${pageNames[page]} ${"─".repeat(68)}\n`;
    out += `    #            gate   fx1    fx2    fx3    fx4    fx5\n\n`;
    ps.forEach(p => {
      out += `    ( ${String(p.pc).padStart(2)}, ${JSON.stringify(p.name)},\n`;
      out += `         ${bool(p.gate)},  ${bool(p.fx1)},  ${bool(p.fx2)},  ${bool(p.fx3)},  ${bool(p.fx4)},  ${bool(p.fx5)}  ),\n\n`;
    });
  }

  out += `]\n\n# Converte para o formato esperado pelo preset_manager\nPRESETS = {\n    pc: {\n        'name': name,\n        'fx': {\n            34: gate,\n            37: fx1,\n            38: fx2,\n            39: fx3,\n            40: fx4,\n            41: fx5,\n        }\n    }\n    for pc, name, gate, fx1, fx2, fx3, fx4, fx5 in _PRESETS_RAW\n}\n\n`;
  out += `# Numero de paginas calculado automaticamente (8 presets por pagina)\n`;
  out += `_total     = len(_PRESETS_RAW)\n_n_pages   = (_total + 7) // 8\n`;
  out += `PAGE_NAMES = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'][:_n_pages]\n`;
  return out;
}

function generateAndShow() {
  document.getElementById("output").value = generateOutput();
  document.getElementById("output").scrollIntoView({ behavior: "smooth" });
  showToast("presets.py generated ✓");
}

function downloadOutput() {
  const txt = generateOutput();
  document.getElementById("output").value = txt;
  const blob = new Blob([txt], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'presets.py';
  a.click();
  URL.revokeObjectURL(a.href);
  showToast('presets.py downloaded ✓');
}

function copyOutput() {
  const txt = generateOutput();
  document.getElementById("output").value = txt;
  navigator.clipboard.writeText(txt).then(() => showToast("Generated & copied ✓"));
}

function importFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const parsed = parsePresetsFile(e.target.result);
    if (!parsed) { showToast('Could not parse presets.py'); return; }
    presets = Array.from({length: 64}, (_, i) => ({
      pc: i, name: '', gate: false, fx1: false, fx2: false, fx3: false, fx4: false, fx5: false
    }));
    parsed.forEach(p => { if (p.pc >= 0 && p.pc < 64) presets[p.pc] = p; });
    currentPage = 0; selectedSlot = -1;
    render();
    showToast(`Imported ${parsed.length} presets ✓`);
    saveSession();
  };
  reader.readAsText(file);
  event.target.value = '';
}

function parsePresetsFile(text) {
  try {
    const parsed = [];
    const tupleRe = /\(\s*(\d+)\s*,\s*(['"])([^'"]*?)\2\s*,\s*([\s\S]*?)\)/g;
    let match;
    while ((match = tupleRe.exec(text)) !== null) {
      const pc   = parseInt(match[1]);
      const name = match[3];
      const vals = match[4].split(',').map(s => s.trim()).filter(s => s.length > 0).map(s => s === '_ON' || s === 'True');
      if (vals.length === 6) parsed.push({ pc, name, gate: vals[0], fx1: vals[1], fx2: vals[2], fx3: vals[3], fx4: vals[4], fx5: vals[5] });
    }
    return parsed.length > 0 ? parsed : null;
  } catch(e) { return null; }
}

function loadDefault() {
  if (!confirm("Reset all presets to defaults?")) return;
  presets = Array.from({length: 64}, (_, i) => ({
    pc: i, name: '', gate: false, fx1: false, fx2: false, fx3: false, fx4: false, fx5: false
  }));
  currentPage = 0; selectedSlot = -1;
  render(); saveSession();
  showToast("Presets reset to defaults ✓");
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2200);
}

function saveSession() {
  localStorage.setItem('cc_presets', JSON.stringify(presets));
  localStorage.setItem('cc_page', currentPage);
}

function loadSession() {
  const saved = localStorage.getItem('cc_presets');
  if (saved) {
    try {
      const data = JSON.parse(saved);
      if (Array.isArray(data) && data.length > 0) {
        presets = data;
        currentPage = parseInt(localStorage.getItem('cc_page') || '0');
        return true;
      }
    } catch(e) {}
  }
  return false;
}

loadSession();
render();
</script>
